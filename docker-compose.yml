        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logisticos
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8005/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  driver-ops:
    image: ghcr.io/breakdisk/logisticos-service-driver-ops:latest
    pull_policy: always
    container_name: logisticos-driver-ops
    restart: unless-stopped
    ports:
      - 8006:8006
    environment:
      APP__HOST: "0.0.0.0"
      APP__PORT: "8006"
      APP__ENV: development
      DATABASE__URL: postgres://logisticos:password@postgres:5432/svc_driver_ops
      DATABASE__MAX_CONNECTIONS: "5"
      KAFKA__BROKERS: kafka:29092
      KAFKA__GROUP_ID: driver-ops-dev
      AUTH__JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-REPLACE-WITH-32CHAR-RANDOM-VALUE-123}
      AUTH__JWT_EXPIRY_SECONDS: "3600"
      AUTH__REFRESH_TOKEN_EXPIRY_SECONDS: "86400"
      REDIS__URL: redis://redis:6379
      SERVICES__IDENTITY_URL: http://identity:8001
      SERVICES__CDP_URL: http://cdp:8002
      SERVICES__ENGAGEMENT_URL: http://engagement:8003
      SERVICES__ORDER_INTAKE_URL: http://order-intake:8004
      SERVICES__DISPATCH_URL: http://dispatch:8005
