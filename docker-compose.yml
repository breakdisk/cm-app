name: oscargomarketnet-logisticosbackend-pqfh0u

networks:
  logisticos:
    driver: bridge
  dokploy-network:
    external: true
volumes:
  postgres_data: null
  redis_data: null
  kafka_data: null
  # ZooKeeper's data holds the cluster ID that Kafka pins in its own
  # meta.properties. Without a *named* volume the cp-zookeeper image falls back
  # to anonymous volumes, which any `down -v` or volume prune discards — ZK then
  # generates a fresh cluster ID, Kafka refuses to join with
  # InconsistentClusterIdException, and the broker crashloops indefinitely.
  # That took the event bus down for ~4 days (2026-07-31 → 2026-08-04).
  zookeeper_data: null
  zookeeper_log: null
  clickhouse_data: null
  grafana_data: null
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: logisticos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: logisticos
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logisticos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - logisticos
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U logisticos
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: logisticos-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - logisticos
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: logisticos-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - logisticos
    healthcheck:
      # `ruok` is not in this image's 4lw whitelist, so a port check is the
      # portable option here.
      test:
        - CMD-SHELL
        - nc -z localhost 2181
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: logisticos-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - logisticos
    healthcheck:
      # Without this the broker can crashloop for days while `docker ps` still
      # reports "Up N seconds": dependent services connect lazily and only log
      # BrokerTransportFailure in a loop, so every one of them stays "healthy"
      # with a dead consumer. Verifies the broker actually serves, not just that
      # the process is alive.
      test:
        - CMD-SHELL
        - kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1
      interval: 30s
      timeout: 15s
      retries: 5
      # Kafka needs a while to come up; don't flap during normal startup.
      start_period: 90s
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: logisticos-clickhouse
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - logisticos
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: logisticos-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - logisticos
  grafana:
    image: grafana/grafana:10.4.0
    container_name: logisticos-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - logisticos
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: logisticos-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - logisticos
  mailhog:
    image: mailhog/mailhog:latest
    container_name: logisticos-mailhog
    networks:
      - logisticos
  minio:
    image: minio/minio:latest
    container_name: logisticos-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9002"
    networks:
      - logisticos
  api-gateway:
    image: ghcr.io/breakdisk/logisticos-service-api-gateway:latest
    container_name: logisticos-api-gateway
    restart: unless-stopped
    ports:
      - 8000:8000
    environment:
      APP__HOST: "0.0.0.0"
      APP__PORT: "8000"
      APP__ENV: development
      # CORS: override in .env for production, e.g.:
      APP__CORS_ALLOWED_ORIGINS: "*"
      AUTH__JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-REPLACE-WITH-32CHAR-RANDOM-VALUE-123}
      AUTH__JWT_EXPIRY_SECONDS: "3600"
      AUTH__REFRESH_TOKEN_EXPIRY_SECONDS: "86400"
      REDIS__URL: redis://redis:6379
      SERVICES__IDENTITY_URL: http://identity:8001
      SERVICES__CDP_URL: http://cdp:8002
      SERVICES__ENGAGEMENT_URL: http://engagement:8003
      SERVICES__ORDER_INTAKE_URL: http://order-intake:8004
      SERVICES__DISPATCH_URL: http://dispatch:8005
      SERVICES__DRIVER_OPS_URL: http://driver-ops:8006
      SERVICES__DELIVERY_EXPERIENCE_URL: http://delivery-experience:8007
      SERVICES__FLEET_URL: http://fleet:8008
      SERVICES__HUB_OPS_URL: http://hub-ops:8009
      SERVICES__CARRIER_URL: http://carrier:8010
      SERVICES__POD_URL: http://pod:8011
      SERVICES__PAYMENTS_URL: http://payments:8012
      SERVICES__ANALYTICS_URL: http://analytics:8013
      SERVICES__MARKETING_URL: http://marketing:8014
      SERVICES__BUSINESS_LOGIC_URL: http://business-logic:8015
      SERVICES__AI_LAYER_URL: http://ai-layer:8016
      SERVICES__FIELD_OPS_URL: http://field-ops:8090
      SERVICES__OMNIDELIV_URL: http://omnideliv:8091
      SERVICES__COMPLIANCE_URL: http://compliance:8017
      SERVICES__WEBHOOKS_URL: http://webhooks:8018
      SERVICES__CONNECTORS_URL: http://connectors:8021
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logisticos
      - dokploy-network
    # Routing is owned by the Traefik file provider, not container labels.
    # Source of truth: infra/traefik/dynamic/oscargomarketnet-logisticosbackend-pqfh0u.yml
    # (deployed to /etc/dokploy/traefik/dynamic/ on the VPS).
    # Dokploy's Traefik ignores docker labels for this stack — see commit history
    # and docs/adr/0009 for context.
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8000/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  identity:
    image: ghcr.io/breakdisk/logisticos-service-identity:latest
    container_name: logisticos-identity
    restart: unless-stopped
    ports:
      - 8001:8001
    environment:
      APP__HOST: "0.0.0.0"
      APP__PORT: "8001"
      APP__ENV: development
      DATABASE__URL: postgres://logisticos:password@postgres:5432/svc_identity
      DATABASE__MAX_CONNECTIONS: "5"
      KAFKA__BROKERS: kafka:29092
      KAFKA__GROUP_ID: identity-dev
      # ⚠ ACCEPTS THE FIXED OTP 123456 FOR ANY PHONE NUMBER.
      #
      # Anyone who can reach this API can sign in as any customer while this is
      # "true". It is set deliberately because real SMS delivery does not work
      # here — TWILIO_SMS_FROM is +15005550006, Twilio's magic test number that
      # never delivers — so removing it locks every OTP app out entirely.
      #
      # Until 2026-08-14 this was not a flag at all: the shortcut keyed off
      # APP__ENV != "production", which is open when the variable is unset and
      # open on this box, which runs "development". Making it an explicit
      # variable is the point — DELETE THIS LINE the moment a real Twilio
      # sending number is configured, and the bypass is closed.
      AUTH__ALLOW_DEV_OTP: "true"
      AUTH__JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-REPLACE-WITH-32CHAR-RANDOM-VALUE-123}
      AUTH__JWT_EXPIRY_SECONDS: "3600"
      AUTH__REFRESH_TOKEN_EXPIRY_SECONDS: "86400"
      LOGISTICOS_INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret-CHANGE-IN-PRODUCTION}
      REDIS__URL: redis://redis:6379
      SERVICES__IDENTITY_URL: http://identity:8001
      SERVICES__CDP_URL: http://cdp:8002
      SERVICES__ENGAGEMENT_URL: http://engagement:8003
      SERVICES__ORDER_INTAKE_URL: http://order-intake:8004
      SERVICES__DISPATCH_URL: http://dispatch:8005
      SERVICES__DRIVER_OPS_URL: http://driver-ops:8006
      SERVICES__DELIVERY_EXPERIENCE_URL: http://delivery-experience:8007
      SERVICES__FLEET_URL: http://fleet:8008
      SERVICES__HUB_OPS_URL: http://hub-ops:8009
      SERVICES__CARRIER_URL: http://carrier:8010
      SERVICES__POD_URL: http://pod:8011
      SERVICES__PAYMENTS_URL: http://payments:8012
      SERVICES__ANALYTICS_URL: http://analytics:8013
      SERVICES__MARKETING_URL: http://marketing:8014
      SERVICES__BUSINESS_LOGIC_URL: http://business-logic:8015
      SERVICES__AI_LAYER_URL: http://ai-layer:8016
      SERVICES__FIELD_OPS_URL: http://field-ops:8090
      SERVICES__OMNIDELIV_URL: http://omnideliv:8091
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logisticos
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8001/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  cdp:
    image: ghcr.io/breakdisk/logisticos-service-cdp:latest
    container_name: logisticos-cdp
    restart: unless-stopped
    ports:
      - 8002:8002
    environment:
      APP__HOST: "0.0.0.0"
      APP__PORT: "8002"
      APP__ENV: development
      DATABASE__URL: postgres://logisticos:password@postgres:5432/svc_cdp
      DATABASE__MAX_CONNECTIONS: "5"
      KAFKA__BROKERS: kafka:29092
      KAFKA__GROUP_ID: cdp-dev
      AUTH__JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-REPLACE-WITH-32CHAR-RANDOM-VALUE-123}
      AUTH__JWT_EXPIRY_SECONDS: "3600"
      AUTH__REFRESH_TOKEN_EXPIRY_SECONDS: "86400"
      REDIS__URL: redis://redis:6379
      SERVICES__IDENTITY_URL: http://identity:8001
      SERVICES__CDP_URL: http://cdp:8002
      SERVICES__ENGAGEMENT_URL: http://engagement:8003
      SERVICES__ORDER_INTAKE_URL: http://order-intake:8004
      SERVICES__DISPATCH_URL: http://dispatch:8005
      SERVICES__DRIVER_OPS_URL: http://driver-ops:8006
      SERVICES__DELIVERY_EXPERIENCE_URL: http://delivery-experience:8007
      SERVICES__FLEET_URL: http://fleet:8008
      SERVICES__HUB_OPS_URL: http://hub-ops:8009
      SERVICES__CARRIER_URL: http://carrier:8010
      SERVICES__POD_URL: http://pod:8011
      SERVICES__PAYMENTS_URL: http://payments:8012
      SERVICES__ANALYTICS_URL: http://analytics:8013
      SERVICES__MARKETING_URL: http://marketing:8014
      SERVICES__BUSINESS_LOGIC_URL: http://business-logic:8015
      SERVICES__AI_LAYER_URL: http://ai-layer:8016
      SERVICES__FIELD_OPS_URL: http://field-ops:8090
      SERVICES__OMNIDELIV_URL: http://omnideliv:8091
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logisticos
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8002/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  engagement:
    image: ghcr.io/breakdisk/logisticos-service-engagement:latest
    container_name: logisticos-engagement
    restart: unless-stopped
    ports:
      - 8003:8003
    environment:
      APP__HOST: "0.0.0.0"
      APP__PORT: "8003"
      APP__ENV: development
      DATABASE__URL: postgres://logisticos:password@postgres:5432/svc_engagement
      DATABASE__MAX_CONNECTIONS: "5"
      KAFKA__BROKERS: kafka:29092
      KAFKA__GROUP_ID: engagement-dev
      AUTH__JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-REPLACE-WITH-32CHAR-RANDOM-VALUE-123}
      AUTH__JWT_EXPIRY_SECONDS: "3600"
      AUTH__REFRESH_TOKEN_EXPIRY_SECONDS: "86400"
      REDIS__URL: redis://redis:6379
      SERVICES__IDENTITY_URL: http://identity:8001
      SERVICES__CDP_URL: http://cdp:8002
      SERVICES__ENGAGEMENT_URL: http://engagement:8003
      SERVICES__ORDER_INTAKE_URL: http://order-intake:8004
      SERVICES__DISPATCH_URL: http://dispatch:8005
      SERVICES__DRIVER_OPS_URL: http://driver-ops:8006
      SERVICES__DELIVERY_EXPERIENCE_URL: http://delivery-experience:8007
      SERVICES__FLEET_URL: http://fleet:8008
      SERVICES__HUB_OPS_URL: http://hub-ops:8009
      SERVICES__CARRIER_URL: http://carrier:8010
      SERVICES__POD_URL: http://pod:8011
      SERVICES__PAYMENTS_URL: http://payments:8012
      SERVICES__ANALYTICS_URL: http://analytics:8013
      SERVICES__MARKETING_URL: http://marketing:8014
      SERVICES__BUSINESS_LOGIC_URL: http://business-logic:8015
      SERVICES__AI_LAYER_URL: http://ai-layer:8016
      SERVICES__FIELD_OPS_URL: http://field-ops:8090
      SERVICES__OMNIDELIV_URL: http://omnideliv:8091
      MAILHOG_SMTP: mailhog:1025
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-dev-placeholder}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-dev-placeholder}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-whatsapp:+15005550006}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-+15005550006}
      # SES adapter reads SES_FROM_EMAIL / SES_FROM_NAME. When unset or left at
      # the placeholder value the adapter degrades to LogChannelAdapter (prints
      # the rendered email body to stdout — useful for CI, useless in prod).
      # AWS credentials come from the standard provider chain
      # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION or IAM role).
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-dev-placeholder}
      SES_FROM_NAME: ${SES_FROM_NAME:-CargoMarket}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logisticos
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8003/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  order-intake:
    image: ghcr.io/breakdisk/logisticos-service-order-intake:latest
    container_name: logisticos-order-intake
    restart: unless-stopped
    ports:
      - 8004:8004
    environment:
      APP__HOST: "0.0.0.0"
      APP__PORT: "8004"
      APP__ENV: development
      # Base URL merchants/customers are redirected back to after hosted
      # checkout for a payment-gated shipment (the payments service's
      # gateway `return_url`). Optional, together with PAYMENTS__URL and
      # QUOTE_TOKEN_SECRET below: "pay online at booking" is disabled unless
      # all three are set (see Config::payment_config()) — order-intake
      # still boots and takes normal cash bookings without it.
      APP__PUBLIC_BASE_URL: ${APP__PUBLIC_BASE_URL:-http://localhost:3001}
      DATABASE__URL: postgres://logisticos:password@postgres:5432/svc_order_intake
      DATABASE__MAX_CONNECTIONS: "5"
      KAFKA__BROKERS: kafka:29092
      KAFKA__GROUP_ID: order-intake-dev
      # Base URL of the payments service. Optional, together with
      # QUOTE_TOKEN_SECRET and APP__PUBLIC_BASE_URL above: "pay online at
      # booking" is one capability, disabled unless all three are set (see
      # Config::payment_config()) — order-intake still boots and takes
      # normal cash bookings without it.
      PAYMENTS__URL: http://payments:8012
      AUTH__JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-REPLACE-WITH-32CHAR-RANDOM-VALUE-123}
      AUTH__JWT_EXPIRY_SECONDS: "3600"
      AUTH__REFRESH_TOKEN_EXPIRY_SECONDS: "86400"
      REDIS__URL: redis://redis:6379
      SERVICES__IDENTITY_URL: http://identity:8001
      SERVICES__CDP_URL: http://cdp:8002
      SERVICES__ENGAGEMENT_URL: http://engagement:8003
      SERVICES__ORDER_INTAKE_URL: http://order-intake:8004
      SERVICES__DISPATCH_URL: http://dispatch:8005
      SERVICES__DRIVER_OPS_URL: http://driver-ops:8006
      SERVICES__DELIVERY_EXPERIENCE_URL: http://delivery-experience:8007
      SERVICES__FLEET_URL: http://fleet:8008
      SERVICES__HUB_OPS_URL: http://hub-ops:8009
      SERVICES__CARRIER_URL: http://carrier:8010
      SERVICES__POD_URL: http://pod:8011
      SERVICES__PAYMENTS_URL: http://payments:8012
      SERVICES__ANALYTICS_URL: http://analytics:8013
      SERVICES__MARKETING_URL: http://marketing:8014
      SERVICES__BUSINESS_LOGIC_URL: http://business-logic:8015
      SERVICES__AI_LAYER_URL: http://ai-layer:8016
      SERVICES__FIELD_OPS_URL: http://field-ops:8090
      SERVICES__OMNIDELIV_URL: http://omnideliv:8091
      # Mapbox Forward Geocoding v6 — bootstraps the MapboxGeocoder
      # AddressNormalizer. When unset or empty, order-intake falls back to
      # PassthroughNormalizer (coordinates: None) and dispatch will reject
      # the shipment at assignment time. Set the pk.* public token via the
      # same env var in .env or the Dokploy service config.
      GEOCODER__MAPBOX_ACCESS_TOKEN: ${GEOCODER__MAPBOX_ACCESS_TOKEN:-}
      # HMAC-SHA256 signing secret for short-TTL quote tokens. Top-level
      # field on Config, read without a `__` prefix. Optional, together with
      # PAYMENTS__URL and APP__PUBLIC_BASE_URL above — see the note on
      # PAYMENTS__URL. Unset disables online payment at booking only; every
      # other order-intake capability is unaffected.
      QUOTE_TOKEN_SECRET: ${QUOTE_TOKEN_SECRET:-dev-quote-token-secret-REPLACE-WITH-32CHAR-RANDOM-VALUE-123}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logisticos
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8004/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  dispatch:
