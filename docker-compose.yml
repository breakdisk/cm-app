  # ── Field-Ops: platform tier owning couriers (ADR-0015) ──────
  field-ops:
    image: ghcr.io/breakdisk/logisticos-service-field-ops:latest
    container_name: logisticos-field-ops
    restart: unless-stopped
    ports:
      - 8090:8090
    environment:
      APP__HOST: "0.0.0.0"
      APP__PORT: "8090"
      APP__ENV: development
      DATABASE__URL: postgres://logisticos:password@postgres:5432/svc_field_ops
      DATABASE__MAX_CONNECTIONS: "5"
      KAFKA__BROKERS: kafka:29092
      AUTH__JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-REPLACE-WITH-32CHAR-RANDOM-VALUE-123}
      # A claim older than this is reclaimable, so a crashed client cannot hold
      # a courier hostage.
      CLAIM_TTL_SECS: "120"
      # Whether a compliance verdict actually withholds work from a courier.
      #
      # OFF, deliberately. No courier in production has a compliance profile —
      # nothing published `driver.registered` until field-ops started doing it —
      # and a new profile begins at `pending_submission`, which compliance does
      # not consider assignable. Switching this on before the fleet has uploaded
      # and had documents approved takes couriers off the road one at a time as
      # their profiles appear.
      #
      # Verdicts are consumed, stored and shown on the admin couriers page
      # regardless; only the blocking is gated. Watch the "Compliance blocked"
      # tile there, and the `enforce_compliance is off` warnings in this
      # service's log, then flip it.
      ENFORCE_COMPLIANCE: "false"
      # Which document set a new courier's compliance profile requires. Belongs
      # to the tenant, not to the code — "PH" demands an LTO licence.
      DEFAULT_JURISDICTION: "PH"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - logisticos

  # ── OmniDeliv AI: hyperlocal multi-vertical delivery ─────────
  omnideliv:
    image: ghcr.io/breakdisk/logisticos-service-omnideliv:latest
    container_name: logisticos-omnideliv
    restart: unless-stopped
    ports:
      - 8091:8091
    environment:
      APP__HOST: "0.0.0.0"
      APP__PORT: "8091"
      APP__ENV: development
      DATABASE__URL: postgres://logisticos:password@postgres:5432/svc_omnideliv
      DATABASE__MAX_CONNECTIONS: "10"
      KAFKA__BROKERS: kafka:29092
      AUTH__JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-REPLACE-WITH-32CHAR-RANDOM-VALUE-123}
      # How stale a vendor's stock declaration may be before the mesh stops
      # trusting it and proposes substitutes defensively.
      STOCK_FRESHNESS_MINS: "30"
      # Product photos. Absent, the service still boots and serves catalogs —
      # only the photo routes report themselves unconfigured. minio is on this
      # network with no published port, which is why bytes go through the
      # service rather than a presigned URL the browser could not reach.
      STORAGE__ENDPOINT: http://minio:9000
      STORAGE__BUCKET: omnideliv-catalog
      STORAGE__ACCESS_KEY: minioadmin
      STORAGE__SECRET_KEY: minioadmin
      STORAGE__REGION: us-east-1
      STORAGE__FORCE_PATH_STYLE: "true"
      MESH_DEADLINE_SECS: "${OMNIDELIV_MESH_DEADLINE_SECS:-45}"
      # Checkout offers every placed order to field-ops. WITHOUT SERVICE_TOKEN
      # every checkout fails: field-ops authenticates its operational routes and
      # the 401 surfaces to the customer as "no courier available".
      FIELD_OPS_URL: http://field-ops:8090
      # The mesh. Without a key the agent path fails; browse and checkout still
      # work, which is the whole point of the non-AI fallback.
      CLAUDE_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: claude-opus-4-6
      CLAUDE_MAX_TOKENS: "8192"
      # Slice-one placeholders: the mesh tool box is built once at startup, so
      # these stand in for per-request tenant and delivery address.
      DEFAULT_TENANT_ID: ${OMNIDELIV_DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      DEFAULT_LAT: "14.5995"
      DEFAULT_LNG: "120.9842"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      field-ops:
        condition: service_started
    networks:
      - logisticos
