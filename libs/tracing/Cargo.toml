[package]
# Never published. Also what lets cargo-deny treat this as private and skip
# the licence check — these crates carry no SPDX expression because they are
# proprietary, not because anyone forgot.
publish = false
name        = "logisticos-tracing"
description = "OpenTelemetry + tracing-subscriber initialisation for all services"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
anyhow.workspace             = true
tracing.workspace            = true
tracing-subscriber.workspace = true
opentelemetry.workspace      = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
