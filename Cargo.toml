[workspace]
resolver = "2"

members = [
    # Shared Libraries
    "libs/common",
    "libs/config",
    "libs/errors",
    "libs/auth",
    "libs/tracing",
    "libs/types",
    "libs/events",
    "libs/geo",
    "libs/ai-client",
    "libs/agent-runtime",

    # Microservices
    "services/identity",
    "services/cdp",
    "services/engagement",
    "services/order-intake",
    "services/omnideliv",
    "services/omnideliv/crates/mesh",
    "services/dispatch",
    "services/driver-ops",
    "services/field-ops",
    "services/compliance",
    "services/delivery-experience",
    "services/fleet",
    "services/hub-ops",
    "services/carrier",
    "services/pod",
    "services/payments",
    "services/analytics",
    "services/marketing",
    "services/business-logic",
    "services/ai-layer",
    "services/api-gateway",
    "services/webhooks",
    "services/connectors",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["LogisticOS Team"]
license      = "UNLICENSED"
# Floor is set by the AWS SDK, which requires 1.94.1 as of aws-config 1.10 /
# aws-sdk-s3 1.141 — the versions that moved off the vulnerable rustls 0.21
# stack. Pinned to 1.97 because that is the toolchain the workspace is
# actually verified against (cargo check, clippy -D warnings) and the one the
# service Dockerfiles build with; keep those two in step.
rust-version = "1.97"

[workspace.dependencies]
# Async runtime
tokio        = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1" }

# Web framework
axum         = { version = "0.7", features = ["macros", "multipart", "ws"] }
axum-extra   = { version = "0.9", features = ["typed-header"] }
tower        = { version = "0.4" }
tower-http   = { version = "0.5", features = ["cors", "trace", "compression-gzip", "request-id"] }
hyper        = { version = "1" }

# gRPC
tonic        = { version = "0.11" }
tonic-build  = { version = "0.11" }
prost        = { version = "0.12" }

# Model Context Protocol — remote MCP server transport (ai-layer)
rmcp         = { version = "3.0.1", features = ["server", "transport-streamable-http-server"] }

# Database
sqlx         = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
redis        = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = { version = "1" }

# Error handling
thiserror    = { version = "1" }
anyhow       = { version = "1" }

# Tracing / Observability
tracing               = { version = "0.1" }
tracing-subscriber    = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry         = { version = "0.22" }
opentelemetry-otlp    = { version = "0.15" }
tracing-opentelemetry = { version = "0.23" }

# Auth / Security
jsonwebtoken = { version = "9" }
argon2       = { version = "0.5" }
rand         = { version = "0.8" }
sha2         = { version = "0.10" }
subtle       = { version = "2" }
hmac         = { version = "0.12" }
base64       = { version = "0.22" }

# IDs & Time
uuid         = { version = "1", features = ["v4", "serde"] }
chrono       = { version = "0.4", features = ["serde"] }
ulid         = { version = "1" }

# Config
config       = { version = "0.14" }
dotenvy      = { version = "0.15" }

# Validation
validator    = { version = "0.21", features = ["derive"] }

# Async traits
async-trait  = { version = "0.1" }

# Kafka
rdkafka      = { version = "0.36", default-features = false, features = ["naive-runtime", "cmake-build"] }

# HTTP client
reqwest      = { version = "0.12", features = ["json", "rustls-tls"] }

# Object storage (S3-compatible)
# `default-features = false` here is a security fix, not tidying. These SDKs'
# default feature set includes `rustls`, which despite the name is the *legacy*
# hyper-0.14 connector: it pulls rustls 0.21 and rustls-webpki 0.101.7, carrying
# RUSTSEC-2026-0098/0099/0104 (name constraints wrongly accepted, and a reachable
# panic parsing CRLs). The modern TLS stack is a separate feature,
# `default-https-client` → rustls-aws-lc → rustls 0.23, which is kept below.
# Everything else here is that same default list, restated so dropping the
# default does not silently remove sigv4a/http-1x/rt-tokio too.
aws-sdk-s3    = { version = "1", default-features = false, features = ["behavior-version-latest", "sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-sesv2 = { version = "1", default-features = false, features = ["behavior-version-latest", "sigv4a", "default-https-client", "rt-tokio"] }
aws-config    = { version = "1" }

# Geo / Spatial
geo          = { version = "0.28" }

# Internal crates
logisticos-common  = { path = "libs/common" }
logisticos-config  = { path = "libs/config" }
logisticos-errors  = { path = "libs/errors" }
logisticos-auth    = { path = "libs/auth" }
logisticos-tracing = { path = "libs/tracing" }
logisticos-types   = { path = "libs/types" }
logisticos-events  = { path = "libs/events" }
logisticos-geo     = { path = "libs/geo" }
logisticos-ai      = { path = "libs/ai-client" }
logisticos-agent-runtime = { path = "libs/agent-runtime" }
omnideliv-mesh   = { path = "services/omnideliv/crates/mesh" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

[profile.dev]
opt-level       = 0
debug           = true
split-debuginfo = "off"

# Lightweight release profile for Docker builds — avoids OOM on parallel service builds
[profile.docker]
inherits      = "release"
opt-level     = 2
lto           = "off"
codegen-units = 4
strip         = true
debug         = false
