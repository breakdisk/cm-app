android.useAndroidX=true
# Jetifier rewrites legacy android.support.* references in dependency jars. Every
# dependency here is AndroidX already, so it had nothing to do but still ran the
# transform on each jar — including material-icons-extended, which is large enough
# that jetifying it once per module's unit-test variant exhausted the CI heap
# (JetifyTransform -> Java heap space, on every :feature:* hiltAggregateDeps task).
# The APK build never hit it because only unit-test variants fan the work out that
# widely. Re-enable only if a genuinely legacy dependency is added.
android.enableJetifier=false
# 2048m was sized for assemble-only builds. Running unit tests adds Hilt dep
# aggregation for every module's test variant, and with parallel=true those run
# concurrently.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
