# ============================================================
# OmniDeliv — Consumer App EAS Build
# ============================================================
# Builds apps/omnideliv-app via EAS Build (cloud).
#
# OmniDeliv ships as its own app rather than a tab inside the customer app:
# different audience (hyperlocal food/grocery ordering vs parcel logistics),
# its own bundle id `net.cargomarket.omnideliv`, and its own EAS project. See
# ADR-0009 for the multi-product split.
#
# Auth: reuses the same EXPO_TOKEN repository secret as the customer app. That
# works because the EAS project was moved to the `cargomarket` account — under
# its original `breakdiskexpo` owner this token had no access to it, and the
# build would have failed on a permission error that reads like a bad token.
#
# Triggered:
#   - automatically on push to master that touches the app
#     (builds the `preview` profile for Android — internal APK)
#   - manually (workflow_dispatch) with a choice of platform + profile
#     and an optional production submit step.
# ============================================================

name: Build OmniDeliv App (EAS)

on:
  push:
    branches: [master]
    paths:
      - "apps/omnideliv-app/**"
      - ".github/workflows/build-omnideliv-app-eas.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        type: choice
        required: true
        default: android
        options:
          - android
          - ios
          - all
      profile:
        description: "EAS build profile"
        type: choice
        required: true
        default: preview
        options:
          - development
          - preview
          - production
      submit:
        description: "Submit to store after build (production only)"
        type: boolean
        required: false
        default: false

concurrency:
  group: eas-omnideliv-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/omnideliv-app
    env:
      # On push, inputs.* are empty → fall back to android/preview.
      # On workflow_dispatch, the chosen inputs win.
      PLATFORM: ${{ inputs.platform || 'android' }}
      PROFILE: ${{ inputs.profile || 'preview' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # 22, not 20: `expo/expo-github-action` below installs
          # `eas-version: latest`, and current eas-cli pulls
          # @oclif/plugin-autocomplete, which requires node >=22. On 20 the
          # install aborts with "Found incompatible module" before any build
          # starts -- a red run with no code change.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/omnideliv-app/package-lock.json

      - name: Check EXPO_TOKEN
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # Missing token is a hard error on a manual run (the user explicitly
        # asked for a build), but only a skipped build + warning on auto-push
        # so it never red-X's every master commit.
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is present."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::EXPO_TOKEN repository secret is not set."
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_TOKEN not set — skipping the EAS build."
          fi

      - name: Set up EAS
        if: steps.token.outputs.present == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: EAS Build (non-interactive, wait for completion)
        if: steps.token.outputs.present == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform "$PLATFORM" \
            --profile "$PROFILE" \
            --non-interactive \
            --wait

      - name: EAS Submit (production only)
        if: ${{ steps.token.outputs.present == 'true' && inputs.submit && inputs.profile == 'production' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit \
            --platform "$PLATFORM" \
            --profile production \
            --non-interactive \
            --latest
