name: Build Android Customer App

on:
  push:
    branches: [master]
    paths:
      - "apps/customer-app/**"
      - ".github/workflows/build-android-customer.yml"
  workflow_dispatch:

jobs:
  build:
    name: EAS Build — preview APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/customer-app/package-lock.json

      - name: Install dependencies
        working-directory: apps/customer-app
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview APK
        working-directory: apps/customer-app
        run: eas build --profile preview --platform android --non-interactive

      - name: Download built APK
        working-directory: apps/customer-app
        run: |
          APK_URL=$(eas build:list --platform android --limit 1 --non-interactive --json \
            | python3 -c "import sys,json; builds=json.load(sys.stdin); print(builds[0]['artifacts']['buildUrl'])")
          echo "APK_URL=$APK_URL" >> $GITHUB_ENV
          curl -L "$APK_URL" -o customer-app-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-preview-${{ github.run_number }}
          path: apps/customer-app/customer-app-preview.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/customer-app/customer-app-preview.apk
