# ============================================================
# LogisticOS — Rust CI Pipeline
# ============================================================
# Runs on every push/PR touching Rust source.
# Jobs: detect-changes → lint → test → security-audit → benchmark
# ============================================================

name: CI — Rust

on:
  # Lets a change to this file prove itself. Without it, editing the workflow
  # triggers a run in which `detect-changes` finds no service touched, every
  # job is skipped, and the run reports **green having tested nothing** — which
  # is how a broken lint job stayed broken while the badge said success.
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "services/**"
      - "libs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-rust.yml"
      # The lint job's guard scripts. Without this a change to one of them does
      # not even trigger the workflow, so the guard ships unexercised.
      - "scripts/check-*.sh"
      - "scripts/check-*.py"
  pull_request:
    branches:
      - master
    paths:
      - "services/**"
      - "libs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-rust.yml"
      # The lint job's guard scripts. Without this a change to one of them does
      # not even trigger the workflow, so the guard ships unexercised.
      - "scripts/check-*.sh"
      - "scripts/check-*.py"

concurrency:
  group: ci-rust-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  SQLX_OFFLINE: "true"   # lint/check jobs use pre-generated .sqlx metadata

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: detect-changes
  # Uses dorny/paths-filter to produce a JSON matrix of only the
  # services/libs that actually changed, keeping CI fast.
  # ──────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      rust_changed: ${{ steps.filter.outputs.rust_any }}
      has_lib_changes: ${{ steps.filter.outputs.libs }}
      matrix: ${{ steps.build-matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust_any:
              - "services/**"
              - "libs/**"
              - "Cargo.toml"
              - "Cargo.lock"
            libs:
              - "libs/**"
            api-gateway:
              - "services/api-gateway/**"
            identity:
              - "services/identity/**"
            cdp:
              - "services/cdp/**"
            engagement:
              - "services/engagement/**"
            order-intake:
              - "services/order-intake/**"
            omnideliv:
              - "services/omnideliv/**"
            connectors:
              - "services/connectors/**"
            field-ops:
              - "services/field-ops/**"
            dispatch:
              - "services/dispatch/**"
            driver-ops:
              - "services/driver-ops/**"
            delivery-experience:
              - "services/delivery-experience/**"
            fleet:
              - "services/fleet/**"
            hub-ops:
              - "services/hub-ops/**"
            carrier:
              - "services/carrier/**"
            pod:
              - "services/pod/**"
            payments:
              - "services/payments/**"
            analytics:
              - "services/analytics/**"
            marketing:
              - "services/marketing/**"
            business-logic:
              - "services/business-logic/**"
            ai-layer:
              - "services/ai-layer/**"

      - name: Build test matrix
        id: build-matrix
        shell: bash
        run: |
          ALL_SERVICES='["api-gateway","identity","cdp","engagement","order-intake","omnideliv","connectors","field-ops","dispatch","driver-ops","delivery-experience","fleet","hub-ops","carrier","pod","payments","analytics","marketing","business-logic","ai-layer"]'

          # A manual run means someone wants to verify the whole workspace —
          # typically because a previous run's matrix was empty or skipped and
          # they need to see the tests actually execute. Without this branch,
          # workflow_dispatch has no push range for paths-filter to diff, so it
          # detects nothing changed and skips every service: a manual run of a
          # test workflow that runs no tests, reported green.
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual run — running full service matrix"
            echo "matrix={\"service\":${ALL_SERVICES}}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If shared lib changes, test all services (transitive impact)
          if [ "${{ steps.filter.outputs.libs }}" == "true" ]; then
            echo "Lib changes detected — running full service matrix"
            echo "matrix={\"service\":${ALL_SERVICES}}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otherwise build matrix from only changed services
          CHANGED="[]"
          declare -a ALL=(
            api-gateway identity cdp engagement order-intake omnideliv connectors field-ops dispatch
            driver-ops delivery-experience fleet hub-ops carrier pod
            payments analytics marketing business-logic ai-layer
          )

          for SVC in "${ALL[@]}"; do
            # dorny/paths-filter outputs are available as JSON on steps.filter.outputs
            VAL=$(echo '${{ toJSON(steps.filter.outputs) }}' | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('$SVC','false'))" 2>/dev/null || echo "false")
            if [ "$VAL" == "true" ]; then
              CHANGED=$(echo "$CHANGED" | python3 -c \
                "import sys,json; l=json.load(sys.stdin); l.append('${SVC}'); print(json.dumps(l))" 2>/dev/null || echo "$CHANGED")
            fi
          done

          # Guarantee at least one entry so matrix jobs don't fail with empty matrix
          if [ "$CHANGED" == "[]" ]; then
            echo "No specific service changes detected — defaulting to api-gateway"
            CHANGED='["api-gateway"]'
          fi

          echo "Test matrix services: $CHANGED"
          echo "matrix={\"service\":${CHANGED}}" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────
  # JOB 2: lint
  # Runs rustfmt (format check) and clippy (deny all warnings)
  # across the entire workspace. Runs once — not per-service.
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    needs: detect-changes
    # Also on a manual run: linting is workspace-wide, so "no service changed"
    # is not a reason to skip it when the thing that changed is the linter's own
    # configuration. That gap is why a lint job that could not compile anything
    # sat broken behind a green badge.
    if: >-
      needs.detect-changes.outputs.rust_changed == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Fails fast, before toolchain setup — this needs no Rust, only grep.
      - name: Check agent-runtime boundary
        run: ./scripts/check-runtime-boundary.sh

      # Also grep-only, also fails fast. A consumer subscribing to a topic that
      # does not exist yet gets UnknownTopicOrPartition and never recovers, so
      # whether the feature works depends on whether the publisher or the
      # consumer started first. 9 of 14 subscribed topics were in that state.
      - name: Check every subscribed Kafka topic is pre-created
        run: ./scripts/check-kafka-topics.sh

      # Same shape of defect, different pair of hand-maintained lists: a
      # permission a handler demands but no role grants makes the endpoint
      # return a clean 403 to everyone forever. That reads as "you lack access",
      # not "nobody can reach this", so it survives review and manual testing.
      # Two live instances on 2026-08-11 — the whole engagement API, and the
      # white-label branding write.
      - name: Check every required permission is grantable
        run: ./scripts/check-rbac-grants.sh

      # Same family again: two hand-maintained lists that must agree, and a
      # failure mode no test can see. sqlx binds are positional, so appending a
      # column to an INSERT and inserting the bind next to its logical
      # neighbours shifts every later parameter — which broke *every* catalog
      # write on 2026-08-14. Repository tests use in-memory fakes and the
      # integration suites stand up no database, so neither can observe it.
      - name: Check INSERTs bind what they name
        run: python3 ./scripts/check-sql-bind-arity.py

      # Same family a third time: the workspace MSRV and 22 Dockerfile base-image
      # pins must agree, and every Rust job here uses the *runner's* toolchain,
      # never the image's — so a lock that outgrows the images passes lint, tests
      # and clippy, then fails 22 image builds at GHCR long after review. That is
      # exactly what a dependency bump to 1.94.1 did on 2026-08-15 against
      # Dockerfiles still pinned at 1.91.
      - name: Check Dockerfiles build with a Rust new enough for the lock
        run: ./scripts/check-rust-version-pins.sh

      # rdkafka-sys vendors and compiles librdkafka from C source, so the
      # runner needs its build deps or *nothing downstream compiles*. Without
      # this, clippy dies on `fatal error: curl/curl.h: No such file or
      # directory` before it lints a single line — which is what the first real
      # run of this workflow did. `ci-rust-quickcheck.yml` already had the step;
      # this workflow never did, and never noticed, because it never ran.
      - name: Install system dependencies (librdkafka build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libssl-dev \
            libsasl2-dev \
            libcurl4-openssl-dev \
            libzstd-dev \
            zlib1g-dev

      - name: Install Rust toolchain (stable + components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Restore build cache (lint)
        uses: actions/cache@v5
        with:
          path: target/
          key: ${{ runner.os }}-cargo-build-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-lint-
            ${{ runner.os }}-cargo-build-

      # Advisory, not a gate. This workflow could never trigger (it watched
      # `main`/`develop`, neither of which exists), so rustfmt has never been
      # enforced and the workspace has drifted: 488 of 823 files differ, mostly
      # hand-aligned match arms and struct literals. Blocking on that would
      # make the very first real run red before clippy — the check that finds
      # actual defects — got to say anything, and a permanently-red pipeline
      # teaches people to ignore CI, which is how this got here.
      #
      # Adopting rustfmt repo-wide is its own commit and its own decision.
      # Flip this to a gate in the same change that does the reformat.
      - name: Check formatting (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Run clippy — deny all warnings
        run: |
          cargo clippy \
            --workspace \
            --all-targets \
            --all-features \
            -- -D warnings \
               -D clippy::all \
               -A clippy::module_name_repetitions \
               -A clippy::must_use_candidate \
               -A clippy::missing_errors_doc \
               -A clippy::missing_panics_doc \
               -A clippy::too_many_lines

      # Advisory for now — same reasoning as the rustfmt step above, and the
      # same instruction: flip this to a gate in the change that clears the
      # backlog. There are 62 (41 on Result, 21 on Option) as of 2026-08-09.
      #
      # The previous implementation was a line-based grep that excluded lines
      # *containing* `#[cfg(test)]`. Inline `#[cfg(test)] mod tests { … }` is
      # the dominant pattern here, and an unwrap 120 lines inside such a block
      # is nowhere near the attribute — so the check reported test doubles and
      # assertions as production violations. It could not have passed on a
      # healthy repo, and it never ran, so nobody found out.
      #
      # Clippy knows what test code is. Without `--all-targets`, `cfg(test)` is
      # off, so inline test modules are not compiled and not linted — which is
      # exactly the boundary this check was trying and failing to express.
      - name: Check for .unwrap() in production paths (advisory)
        continue-on-error: true
        run: |
          cargo clippy --workspace --lib --bins --all-features \
            -- -W clippy::unwrap_used 2>&1 | grep -E "unwrap\(\) on" -A 2 || true
          echo ""
          echo "Use the ? operator with thiserror/anyhow instead."

      # Replaces a check that could not fail: it grepped src/main.rs and
      # src/router.rs — files these services do not use for routing — and
      # printed a WARNING with no exit code. It passed while NINE services had
      # /health behind the auth layer, answering 401 to every probe.
      - name: Check /health is reachable without a token
        run: ./scripts/check-health-endpoints.sh

  # ──────────────────────────────────────────────────────────────
  # JOB 3: test
  # Runs full test suite per changed service with live PostgreSQL
  # (postgis/postgis:16-3.4) and Redis (redis:7-alpine) sidecars.
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - lint

    if: needs.detect-changes.outputs.rust_changed == 'true'

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: logisticos_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: logisticos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logisticos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgres://logisticos_test:test_password@localhost:5432/logisticos_test"
      REDIS_URL: "redis://localhost:6379"
      KAFKA_BROKERS: ""          # Kafka not wired in CI — services must handle gracefully
      JWT_SECRET: "ci-test-secret-not-for-production-use-32ch"
      JWT_EXPIRY_SECONDS: "3600"
      REFRESH_TOKEN_EXPIRY_DAYS: "7"
      RUST_LOG: "debug"
      SQLX_OFFLINE: "false"      # Use live DB for integration tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # See the lint job: without these, rdkafka-sys cannot build.
      - name: Install system dependencies (librdkafka build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev libsasl2-dev \
            libcurl4-openssl-dev libzstd-dev zlib1g-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sqlx-cli
        run: |
          cargo install sqlx-cli \
            --no-default-features \
            --features postgres,rustls \
            --locked \
            --quiet

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Restore build cache
        uses: actions/cache@v5
        with:
          path: target/
          key: ${{ runner.os }}-cargo-build-test-${{ matrix.service }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-test-${{ matrix.service }}-
            ${{ runner.os }}-cargo-build-test-
            ${{ runner.os }}-cargo-build-

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U logisticos_test && break
            echo "  attempt $i/30…"
            sleep 2
          done
          echo "PostgreSQL ready."

      - name: Initialize base schema
        run: |
          # `|| true` is kept — init.sql is written for a fresh production
          # cluster and re-running parts of it is expected to complain — but the
          # output is no longer sent to /dev/null. A silent base-schema step
          # turns every downstream migration failure into a mystery, which is
          # exactly how the five below looked before this line changed.
          psql "$DATABASE_URL" -f scripts/db/init.sql || true

          # Roles the migrations GRANT to. init.sql creates per-service logins
          # (identity_svc, cdp_svc, …) but the migrations reference a different
          # set — logisticos_service (6 files), logisticos_app (5), app_role (2)
          # and logisticos — which nothing in the repo creates. On a clean
          # database those GRANTs abort the migration, which is why identity,
          # dispatch, carrier, business-logic and delivery-experience all failed
          # before running a single test.
          #
          # NOLOGIN and unprivileged: these exist so GRANT has a subject, not so
          # anything can connect as them.
          for r in logisticos_service logisticos_app app_role logisticos; do
            psql "$DATABASE_URL" -c \
              "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='$r')
               THEN CREATE ROLE $r NOLOGIN; END IF; END \$\$;"
          done

      - name: Run database migrations for ${{ matrix.service }}
        shell: bash
        run: |
          MIGRATIONS_DIR="services/${{ matrix.service }}/migrations"
          if [ ! -d "$MIGRATIONS_DIR" ]; then
            echo "No migrations directory for ${{ matrix.service }} — skipping."
            exit 0
          fi

          # Services do not call `sqlx migrate run` directly — they call
          # `logisticos_common::migrations::run`, which creates the service's
          # schema *before* migrating (ADR-0012). Several migrations rely on
          # that: delivery-experience's 0001 creates schema `tracking` while
          # 0002 writes to `delivery_experience`, which no migration file ever
          # creates. Running the bare sqlx command here skipped that step, so
          # the job failed on something that works fine in the service.
          #
          # The schema name is read from the source rather than derived from the
          # service name — they mostly match with hyphens as underscores, but
          # ai-layer uses `ai`, so deriving it would be wrong exactly once and
          # silently.
          # Two traps here, both of which cost a red job before this shape:
          #
          # 1. The call is not always on one line. connectors wraps it over
          #    four lines, which a single-line pattern cannot see. -A3 spans
          #    the wrapped form and still matches the inline one, and
          #    ./migrations never matches [a-z_]+ because of the dot and
          #    slash, so the schema name is reliably the first hit.
          # 2. SCHEMA=$(grep ...) inherits grep's exit status, and this step
          #    runs under set -eo pipefail — so *no match* aborted the job
          #    instead of taking the warning branch below that exists exactly
          #    to handle it. '|| true' restores the intent.
          SCHEMA=$(grep -rhA3 'migrations::run(' \
                     "services/${{ matrix.service }}/src" 2>/dev/null \
                   | grep -oE '"[a-z_]+"' | head -1 | tr -d '"' || true)
          if [ -n "$SCHEMA" ]; then
            # Dropped first, so the migrations own the schema outright.
            #
            # init.sql above is written for a fresh production cluster and
            # pre-creates some service tables — `identity.tenants` among them,
            # with IF NOT EXISTS. identity's migration 0001 creates the same
            # table *without* IF NOT EXISTS, so the job died on
            # `relation "tenants" already exists` before running a test.
            #
            # Fixing the migration is not an option: it is applied in production
            # and editing it breaks its recorded checksum. Fixing init.sql means
            # deciding whether it should define service-owned tables at all
            # (per ADR-0012 it should not) — a real question, but not one a test
            # database needs answered. This database is disposable, so the
            # migrations simply get a clean schema, which is what they assume.
            echo "Resetting schema '$SCHEMA' so migrations own it"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "DROP SCHEMA IF EXISTS \"$SCHEMA\" CASCADE" \
              -c "CREATE SCHEMA \"$SCHEMA\""
          else
            echo "::warning::no migrations::run call found for ${{ matrix.service }} — not pre-creating a schema"
          fi

          echo "Running migrations for ${{ matrix.service }}..."
          sqlx migrate run --source "$MIGRATIONS_DIR" --database-url "$DATABASE_URL"

      - name: Build ${{ matrix.service }} (check compile)
        run: |
          cargo build \
            --package "logisticos-${{ matrix.service }}" \
            --all-features
        env:
          SQLX_OFFLINE: "false"

      # `shell: bash` is load-bearing on every step that pipes to tee.
      # The GitHub default shell is `bash -e {0}` — `-e` but NOT `pipefail` —
      # so the exit status of `cargo test | tee` is tee's, which is always 0
      # and a failing test suite reports a green job. Naming the shell
      # explicitly gets `set -eo pipefail` and makes the failure propagate.
      - name: Run unit tests
        shell: bash
        run: |
          cargo test \
            --package "logisticos-${{ matrix.service }}" \
            --lib \
            --no-fail-fast \
            -- --nocapture 2>&1 | tee test-unit-${{ matrix.service }}.log

      # `--test '*'` is a hard error when a package has no integration test
      # target — "error: no test target matches pattern `*`" — so this step
      # failed for 18 of 20 services on the matrix's first ever run, none of
      # them because a test failed.
      #
      # Two reasons a service has no target. Some genuinely have no integration
      # tests. Most have `tests/{unit,integration}/mod.rs`, which Cargo does not
      # discover (it finds `tests/*.rs` and `tests/<dir>/main.rs`) — 15 services
      # are in that state and only ai-layer has the `[[test]]` stanzas that fix
      # it. Those suites exist, are not compiled, and have never run.
      #
      # Asking cargo what targets exist, rather than asserting they exist, keeps
      # the step honest for the first case. It deliberately prints a loud line
      # for the second: a service silently reporting "no integration tests" when
      # it has a tests/ directory full of them is how this stayed hidden.
      - name: Run integration tests
        shell: bash
        run: |
          SVC="logisticos-${{ matrix.service }}"
          TARGETS=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys;p=[x for x in json.load(sys.stdin)['packages'] if x['name']=='$SVC'];print(sum(1 for t in (p[0]['targets'] if p else []) if 'test' in t['kind']))")

          if [ "$TARGETS" -eq 0 ]; then
            if [ -d "services/${{ matrix.service }}/tests" ]; then
              echo "::warning::${{ matrix.service }} has a tests/ directory but no test target cargo can see."
              echo "Almost certainly tests/<dir>/mod.rs, which cargo does not discover."
              echo "Add a [[test]] stanza per directory — see services/ai-layer/Cargo.toml."
              ls -R "services/${{ matrix.service }}/tests" || true
            else
              echo "${{ matrix.service }} has no integration tests."
            fi
            exit 0
          fi

          cargo test \
            --package "$SVC" \
            --test '*' \
            --no-fail-fast \
            -- --nocapture 2>&1 | tee test-integration-${{ matrix.service }}.log
        continue-on-error: false

      - name: Run doc tests
        run: |
          cargo test \
            --package "logisticos-${{ matrix.service }}" \
            --doc

      - name: Upload test logs on failure
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-logs-${{ matrix.service }}-${{ github.sha }}
          path: |
            test-unit-${{ matrix.service }}.log
            test-integration-${{ matrix.service }}.log
          retention-days: 7

      - name: Generate coverage (PR only)
        if: github.event_name == 'pull_request'
        run: |
          cargo install cargo-tarpaulin --locked --quiet 2>/dev/null || true
          if command -v cargo-tarpaulin &>/dev/null; then
            cargo tarpaulin \
              --package "logisticos-${{ matrix.service }}" \
              --out Xml \
              --output-dir coverage/ \
              --timeout 120 \
              --skip-clean \
              2>/dev/null || true
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          files: coverage/cobertura.xml
          flags: ${{ matrix.service }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # JOB 4: security-audit
  # cargo-audit checks Cargo.lock against RustSec advisory DB.
  # cargo-deny enforces license policy, bans, and advisories.
  # ──────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.rust_changed == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --quiet

      - name: Run cargo audit (RustSec CVE check)
        # Two advisories are ignored, both because there is no fixed version to
        # upgrade to. Neither is a blanket exemption — check-audit-ignores.sh
        # below re-derives the justification on every run and fails when it
        # stops holding:
        #
        #   RUSTSEC-2023-0071  rsa "Marvin Attack". rsa is never compiled; it
        #                      reaches Cargo.lock only as an optional dependency
        #                      of sqlx-mysql, and we are Postgres-only. cargo
        #                      audit reads the lock, which lists optional
        #                      dependencies that no feature activates.
        #   RUSTSEC-2026-0253  lru panic-safety UAF. This one IS compiled, inside
        #                      aws-sdk-s3's internals. No released lru fixes it
        #                      and aws-sdk-s3 pins the major version. Unsoundness
        #                      rather than a remotely reachable vulnerability.
        run: |
          cargo audit \
            --deny warnings \
            --deny unmaintained \
            --deny unsound \
            --deny yanked \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0253

      # An --ignore never expires on its own: once upstream ships a fix, the flag
      # keeps suppressing the finding and the job stays green for a reason that
      # stopped being true. This asserts each ignored advisory is still reported
      # AND, where the justification is "never compiled", still absent from the
      # build graph.
      - name: Check every ignored advisory still earns its ignore
        run: ./scripts/check-audit-ignores.sh

      - name: Run cargo deny (license + bans policy)
        run: cargo deny check
        # Reads from deny.toml at workspace root

      - name: Scan for hardcoded credentials
        run: |
          echo "Scanning for hardcoded secrets in Rust source..."
          FOUND=false

          # Patterns that indicate hardcoded credentials
          PATTERNS=(
            'password\s*[:=]\s*"[^"]{8,}"'
            'secret\s*[:=]\s*"[^"]{8,}"'
            'api_key\s*[:=]\s*"[^"]{8,}"'
            'ANTHROPIC_API_KEY\s*[:=]\s*"sk-'
            'OPENAI_API_KEY\s*[:=]\s*"sk-'
            'token\s*[:=]\s*"[A-Za-z0-9+/]{40,}"'
          )

          for PATTERN in "${PATTERNS[@]}"; do
            HITS=$(grep -rniE "$PATTERN" services/ libs/ \
              --include='*.rs' \
              | grep -v 'test\|mock\|example\|TODO\|placeholder\|your-' \
              | grep -v '#\[cfg(test)\]' \
              | head -5 || true)
            if [ -n "$HITS" ]; then
              echo "Potential secret found (pattern: $PATTERN):"
              echo "$HITS"
              FOUND=true
            fi
          done

          if [ "$FOUND" == "true" ]; then
            echo ""
            echo "FAIL: Hardcoded credential patterns detected."
            echo "Use environment variables or Vault references instead."
            exit 1
          fi

          echo "Secrets scan passed."

  # ──────────────────────────────────────────────────────────────
  # JOB 5: benchmark
  # Runs cargo bench on dispatch and order-intake (performance-
  # critical services). Only on pushes to main. Uploads results
  # as artifacts and posts regression alerts via PR comments.
  # ──────────────────────────────────────────────────────────────
  benchmark:
    name: Benchmark (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - test
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.rust_changed == 'true'
    permissions:
      contents: write   # needed to push benchmark results to gh-pages branch

    strategy:
      fail-fast: false
      matrix:
        service:
          - dispatch
          - order-intake

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: logisticos_bench
          POSTGRES_PASSWORD: bench_password
          POSTGRES_DB: logisticos_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logisticos_bench"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgres://logisticos_bench:bench_password@localhost:5432/logisticos_bench"
      REDIS_URL: "redis://localhost:6379"
      SQLX_OFFLINE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # See the lint job: without these, rdkafka-sys cannot build.
      - name: Install system dependencies (librdkafka build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev libsasl2-dev \
            libcurl4-openssl-dev libzstd-dev zlib1g-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install sqlx-cli
        run: |
          cargo install sqlx-cli \
            --no-default-features \
            --features postgres,rustls \
            --locked --quiet

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Restore build cache (bench)
        uses: actions/cache@v5
        with:
          path: target/
          key: ${{ runner.os }}-cargo-bench-${{ matrix.service }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-${{ matrix.service }}-
            ${{ runner.os }}-cargo-bench-

      - name: Run migrations
        run: |
          MIGRATIONS_DIR="services/${{ matrix.service }}/migrations"
          if [ -d "$MIGRATIONS_DIR" ]; then
            sqlx migrate run \
              --source "$MIGRATIONS_DIR" \
              --database-url "$DATABASE_URL"
          fi

      # Same pipefail reasoning as the test steps above: without `shell: bash`
      # a benchmark that fails to build or run is masked by tee's exit code.
      - name: Run benchmarks
        shell: bash
        run: |
          cargo bench \
            --package "logisticos-${{ matrix.service }}" \
            -- --output-format bencher \
            2>&1 | tee bench-results-${{ matrix.service }}.txt

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v6
        with:
          name: bench-${{ matrix.service }}-${{ github.sha }}
          path: bench-results-${{ matrix.service }}.txt
          retention-days: 90

      - name: Track benchmark trend (alert on >20% regression)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "${{ matrix.service }} Benchmarks"
          tool: cargo
          output-file-path: bench-results-${{ matrix.service }}.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          alert-threshold: "120%"
          fail-on-alert: true
          alert-comment-cc-users: "@logisticos/backend-team"
          benchmark-data-dir-path: docs/benchmarks/${{ matrix.service }}
