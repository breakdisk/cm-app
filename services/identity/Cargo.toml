[package]
name        = "logisticos-identity"
description = "Identity & Tenant Management Service"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[[bin]]
name = "identity"
path = "src/main.rs"

[dependencies]
logisticos-common.workspace  = true
logisticos-errors.workspace  = true
logisticos-auth.workspace    = true
logisticos-tracing.workspace = true
logisticos-types.workspace   = true
logisticos-events.workspace  = true
tokio.workspace       = true
axum.workspace        = true
axum-extra.workspace  = true
tower-http.workspace  = true
tonic.workspace       = true
prost.workspace       = true
sqlx.workspace        = true
redis.workspace       = true
serde.workspace       = true
serde_json.workspace  = true
jsonwebtoken.workspace = true
argon2.workspace      = true
rand.workspace        = true
thiserror.workspace   = true
anyhow.workspace      = true
uuid.workspace        = true
chrono.workspace      = true
config.workspace      = true
dotenvy.workspace     = true
validator.workspace   = true
rdkafka.workspace     = true
tracing.workspace     = true
async-trait.workspace = true
sha2.workspace        = true
subtle.workspace      = true
hmac                  = "0.12"
base64                = "0.22"
aws-sdk-sesv2.workspace = true
aws-config.workspace    = true

[dev-dependencies]
# axum-test 19.x requires axum ^0.8 — conflicts with workspace axum ^0.7.
# Use tower::ServiceExt::oneshot + http-body-util directly.
tower            = { workspace = true, features = ["util"] }
http-body-util   = "0.1"
tokio            = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json       = "1"
uuid             = { version = "1", features = ["v4"] }
chrono           = { version = "0.4", features = ["serde"] }
# rdkafka for dev testing
rdkafka       = { version = "0.36", default-features = false, features = ["cmake-build", "naive-runtime"] }

# The unit suite only. `tests/integration/mod.rs` has 11 compile errors against
# the current API: `AuthService::new` gained parameters and its argument order
# shifted (hence the run of expected-X-found-Y mismatches), a repository trait
# gained `find_by_email_global`/`find_by_phone`, and it needs a `bytes` dev-dep.
# Repairing it is test-writing, not a stanza.
#
# Cargo discovers tests/*.rs and tests/<dir>/main.rs — but NOT tests/<dir>/mod.rs,
# so without a stanza the suite is not a target: never compiled, never run, and
# `cargo test` reports a clean pass over nothing.
[[test]]
name = "unit"
path = "tests/unit/mod.rs"
