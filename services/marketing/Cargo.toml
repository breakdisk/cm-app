[package]
name        = "logisticos-marketing"
description = "Marketing Automation Engine — Campaigns, loyalty, referrals"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[[bin]]
name = "marketing"
path = "src/main.rs"

[dependencies]
logisticos-common.workspace  = true
logisticos-errors.workspace  = true
logisticos-auth.workspace    = true
logisticos-tracing.workspace = true
logisticos-types.workspace   = true
logisticos-events.workspace  = true
tokio.workspace      = true
axum.workspace       = true
tower-http.workspace = true
tonic.workspace      = true
prost.workspace      = true
sqlx.workspace       = true
redis.workspace      = true
serde.workspace      = true
serde_json.workspace = true
thiserror.workspace  = true
anyhow.workspace     = true
uuid.workspace       = true
chrono.workspace     = true
config.workspace     = true
dotenvy.workspace    = true
validator.workspace  = true
rdkafka.workspace    = true
reqwest.workspace    = true
tracing.workspace    = true
async-trait.workspace = true

# The unit suite only. `tests/integration/mod.rs` is deliberately NOT a target
# yet: it builds an `AppState`, and two of that struct's fields are concrete
# `Arc<PgAbTestRepository>` / `Arc<PgJourneyRepository>` rather than trait
# objects, so the HTTP layer cannot be exercised without a live Postgres.
# `campaign_svc` beside them takes a trait and is mocked freely — these two
# deviate from the pattern this service already uses. Extracting traits for them
# is the fix, and it is a production change rather than a test one, so it wants
# its own commit.
#
# Cargo discovers tests/*.rs and tests/<dir>/main.rs — but NOT tests/<dir>/mod.rs.
[[test]]
name = "unit"
path = "tests/unit/mod.rs"
