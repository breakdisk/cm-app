[package]
# Never published. Also what lets cargo-deny treat this as private and skip
# the licence check — these crates carry no SPDX expression because they are
# proprietary, not because anyone forgot.
publish = false
name        = "logisticos-fleet"
description = "Fleet Management — Vehicle tracking, telematics, maintenance"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
logisticos-common.workspace  = true
logisticos-errors.workspace  = true
logisticos-auth.workspace    = true
logisticos-tracing.workspace = true
logisticos-types.workspace   = true
logisticos-events.workspace  = true
tokio.workspace      = true
axum.workspace       = true
tower-http.workspace = true
tonic.workspace      = true
prost.workspace      = true
sqlx.workspace       = true
redis.workspace      = true
serde.workspace      = true
serde_json.workspace = true
thiserror.workspace  = true
anyhow.workspace     = true
uuid.workspace       = true
chrono.workspace     = true
config.workspace     = true
dotenvy.workspace    = true
validator.workspace  = true
rdkafka.workspace    = true
tracing.workspace    = true
async-trait.workspace = true

# The integration suite drives the real Axum router via ServiceExt::oneshot.
[dev-dependencies]
tower = { workspace = true }

# Cargo discovers tests/*.rs and tests/<dir>/main.rs — but NOT tests/<dir>/mod.rs,
# which is the layout used here. Without these stanzas the suite is not a target:
# it never compiles, never runs, and `cargo test` reports a clean pass.
[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"
