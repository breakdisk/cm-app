[package]
name        = "logisticos-order-intake"
description = "Order and Shipment Intake — Validation, normalization, scheduling"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[[bin]]
name = "order_intake"
path = "src/main.rs"

[dependencies]
logisticos-common.workspace  = true
logisticos-errors.workspace  = true
logisticos-auth.workspace    = true
logisticos-tracing.workspace = true
logisticos-types.workspace   = true
logisticos-events.workspace  = true
tokio.workspace      = true
axum.workspace       = true
tower-http.workspace = true
tonic.workspace      = true
prost.workspace      = true
sqlx.workspace       = true
redis.workspace      = true
serde.workspace      = true
serde_json.workspace = true
thiserror.workspace  = true
anyhow.workspace     = true
uuid.workspace       = true
chrono.workspace     = true
config.workspace     = true
dotenvy.workspace    = true
validator.workspace  = true
rdkafka.workspace    = true
tracing.workspace    = true
rand.workspace       = true
async-trait.workspace = true
reqwest.workspace    = true

[dev-dependencies]
# axum-test 19.x requires axum ^0.8 but the workspace pins axum ^0.7,
# causing a duplicate-crate conflict (E0277 on IntoTransportLayer).
# We use tower::ServiceExt::oneshot + http-body-util directly instead.
tower            = { workspace = true, features = ["util"] }
http-body-util   = "0.1"
bytes            = "1"
tokio            = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json       = "1"
uuid             = { version = "1", features = ["v4"] }
chrono           = { version = "0.4", features = ["serde"] }
