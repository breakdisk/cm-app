[package]
name        = "logisticos-driver-ops"
description = "Driver Operations — Super app backend, POD, task management"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[[bin]]
name = "driver_ops"
path = "src/main.rs"

[dependencies]
logisticos-common.workspace  = true
logisticos-errors.workspace  = true
logisticos-auth.workspace    = true
logisticos-tracing.workspace = true
logisticos-types.workspace   = true
logisticos-events.workspace  = true
tokio.workspace      = true
axum.workspace       = true
tower-http.workspace = true
tonic.workspace      = true
prost.workspace      = true
sqlx.workspace       = true
redis.workspace      = true
serde.workspace      = true
serde_json.workspace = true
thiserror.workspace  = true
anyhow.workspace     = true
uuid.workspace       = true
chrono.workspace     = true
config.workspace     = true
dotenvy.workspace    = true
validator.workspace  = true
rdkafka.workspace      = true
tracing.workspace      = true
async-trait.workspace  = true
reqwest.workspace      = true
jsonwebtoken.workspace = true
base64       = "0.22"

# The unit suite is NOT wired either: it has 13 compile errors of its own, and
# integration has 120 — by far the largest drift of any service. Both want a
# dedicated pass. The stanzas are left commented rather than deleted so the
# next person finds the suites instead of rediscovering that they exist.
#
# Cargo discovers tests/*.rs and tests/<dir>/main.rs — but NOT tests/<dir>/mod.rs,
# so without a stanza the suite is not a target: never compiled, never run, and
# `cargo test` reports a clean pass over nothing.
# [[test]]
# name = "unit"
# path = "tests/unit/mod.rs"
#
# [[test]]
# name = "integration"
# path = "tests/integration/mod.rs"
