[package]
# Never published. Also what lets cargo-deny treat this as private and skip
# the licence check — these crates carry no SPDX expression because they are
# proprietary, not because anyone forgot.
publish = false
name        = "logisticos-payments"
description = "Payments and Billing — COD, invoicing, wallets, fraud detection"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[[bin]]
name = "payments"
path = "src/main.rs"

[dependencies]
logisticos-common.workspace  = true
logisticos-errors.workspace  = true
logisticos-auth.workspace    = true
logisticos-tracing.workspace = true
logisticos-types.workspace   = true
logisticos-events.workspace  = true
tokio.workspace      = true
axum.workspace       = true
tower-http.workspace = true
tonic.workspace      = true
prost.workspace      = true
sqlx.workspace       = true
redis.workspace      = true
serde.workspace      = true
serde_json.workspace = true
thiserror.workspace  = true
anyhow.workspace     = true
uuid.workspace       = true
chrono.workspace     = true
config.workspace     = true
dotenvy.workspace    = true
validator.workspace  = true
rdkafka.workspace    = true
tracing.workspace    = true
async-trait          = "0.1"
reqwest.workspace    = true
# `default-features = false` is load-bearing, not tidiness: chromiumoxide's
# defaults are ["async-std-runtime", "bytes"], so asking for "tokio-runtime"
# without dropping them compiled *both* runtimes into this service and pulled in
# async-std, which RUSTSEC-2025-0052 flags as discontinued. `bytes` is a real
# default and is kept.
chromiumoxide        = { version = "0.6", default-features = false, features = ["tokio-runtime", "bytes"] }
tera                 = "1"
futures              = "0.3"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

# Unit suite only. `tests/integration/mod.rs` still has 27 compile errors against
# the current API and wants its own pass.
#
# Cargo discovers tests/*.rs and tests/<dir>/main.rs — but NOT tests/<dir>/mod.rs,
# so without a stanza the suite is not a target: never compiled, never run, and
# `cargo test` reports a clean pass over nothing.
[[test]]
name = "unit"
path = "tests/unit/mod.rs"
#
# [[test]]
# name = "integration"
# path = "tests/integration/mod.rs"
