[package]
# Never published. Also what lets cargo-deny treat this as private and skip
# the licence check — these crates carry no SPDX expression because they are
# proprietary, not because anyone forgot.
publish = false
name        = "logisticos-carrier"
description = "Carrier and Partner Management — Onboarding, SLA, auto-allocation"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[[bin]]
name = "carrier"
path = "src/main.rs"

[dependencies]
logisticos-common.workspace  = true
logisticos-errors.workspace  = true
logisticos-auth.workspace    = true
logisticos-tracing.workspace = true
logisticos-types.workspace   = true
logisticos-events.workspace  = true
tokio.workspace      = true
axum.workspace       = true
tower-http.workspace = true
tonic.workspace      = true
prost.workspace      = true
sqlx.workspace       = true
redis.workspace      = true
serde.workspace      = true
serde_json.workspace = true
thiserror.workspace  = true
anyhow.workspace     = true
uuid.workspace       = true
chrono.workspace     = true
config.workspace     = true
dotenvy.workspace    = true
validator.workspace  = true
rdkafka.workspace    = true
tracing.workspace    = true
async-trait.workspace = true
rand.workspace        = true
sha2.workspace        = true
hmac.workspace        = true
base64.workspace      = true
reqwest.workspace     = true
aws-sdk-s3.workspace  = true
aws-config.workspace  = true

[dev-dependencies]
# `rdkafka::mocking::MockCluster` is an in-process broker. `MarketplaceService`
# holds a concrete `Arc<KafkaProducer>` rather than a trait object, so the
# booking tests cannot substitute a fake -- without a broker every publish in a
# test waits out the producer's 5s message timeout. Not feature-gated in 0.36;
# the workspace's `cmake-build` is what supplies librdkafka's mock support.
rdkafka.workspace = true
tokio   = { workspace = true, features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tonic-build.workspace       = true
protoc-bin-vendored         = "3"

# The unit suite only. `tests/integration/mod.rs` has 14 compile errors of its
# own against the current API and wants its own pass.
#
# Cargo discovers tests/*.rs and tests/<dir>/main.rs — but NOT tests/<dir>/mod.rs,
# so without a stanza the suite is not a target: never compiled, never run, and
# `cargo test` reports a clean pass.
[[test]]
name = "unit"
path = "tests/unit/mod.rs"
