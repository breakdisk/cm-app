[package]
name        = "logisticos-delivery-experience"
description = "Customer Delivery Experience — Live tracking, ETA, portal"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[[bin]]
name = "delivery_experience"
path = "src/main.rs"

[dependencies]
logisticos-common.workspace  = true
logisticos-errors.workspace  = true
logisticos-auth.workspace    = true
logisticos-tracing.workspace = true
logisticos-types.workspace   = true
logisticos-events.workspace  = true
tokio.workspace      = true
axum.workspace       = true
tower-http.workspace = true
tonic.workspace      = true
prost.workspace      = true
sqlx.workspace       = true
redis.workspace      = true
serde.workspace      = true
serde_json.workspace = true
thiserror.workspace  = true
anyhow.workspace     = true
uuid.workspace       = true
chrono.workspace     = true
config.workspace     = true
dotenvy.workspace    = true
validator.workspace  = true
rdkafka.workspace      = true
tracing.workspace      = true
async-trait.workspace  = true
reqwest.workspace      = true

# The unit suite only. `tests/integration/mod.rs` has 26 compile errors against
# the current API and wants its own pass.
#
# Cargo discovers tests/*.rs and tests/<dir>/main.rs — but NOT tests/<dir>/mod.rs,
# so without a stanza the suite is not a target: never compiled, never run, and
# `cargo test` reports a clean pass over nothing.
[[test]]
name = "unit"
path = "tests/unit/mod.rs"
