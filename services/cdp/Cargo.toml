[package]
name        = "logisticos-cdp"
description = "Customer Data Platform — Unified profiles, behavioral tracking, CLV"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[[bin]]
name = "cdp"
path = "src/main.rs"

[dependencies]
logisticos-common.workspace  = true
logisticos-errors.workspace  = true
logisticos-auth.workspace    = true
logisticos-tracing.workspace = true
logisticos-types.workspace   = true
logisticos-events.workspace  = true
tokio.workspace      = true
axum.workspace       = true
tower-http.workspace = true
tonic.workspace      = true
prost.workspace      = true
sqlx.workspace       = true
redis.workspace      = true
serde.workspace      = true
serde_json.workspace = true
thiserror.workspace  = true
anyhow.workspace     = true
uuid.workspace       = true
chrono.workspace     = true
config.workspace     = true
dotenvy.workspace    = true
validator.workspace  = true
rdkafka.workspace    = true
tracing.workspace    = true
async-trait.workspace = true

[dev-dependencies]
tower        = { workspace = true }

# The unit suite only. `tests/integration/mod.rs` builds an `AppState`, which
# gained `segment_svc`, `consent_svc`, `jwt` and `kafka` since it was written.
# All four are constructible in a test — the services take trait objects and
# `KafkaProducer::new` builds its client lazily without touching a broker — but
# `SegmentRepository` has ten methods and no mock exists yet. That is the work
# this needs, and it is test-writing rather than a stanza.
#
# Cargo discovers tests/*.rs and tests/<dir>/main.rs — but NOT tests/<dir>/mod.rs.
[[test]]
name = "unit"
path = "tests/unit/mod.rs"
